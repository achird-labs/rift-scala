# Closes the full-auto dependency loop: when CI passes on a rift-java bump PR (opened by
# `java-bump.yml`), squash-merge it and cut the next patch release by pushing a `vX.Y.Z` tag.
#
# Triggered by the *conclusion* of the CI workflow (workflow_run), so it observes the real, aggregate
# CI result — success only if BOTH matrix jobs pass (JDK 21 spawn replay + JDK 22 embedded
# conformance). A red CI run simply does nothing here: the bump PR stays open for human intervention.
# That is the intended fail-to-human path.
#
# Guarded to act ONLY on a successful, PR-triggered CI run whose head is a `chore/rift-java-*` branch
# in THIS repo (never a fork) — so an arbitrary green PR can never trip an auto-merge + release.
#
# WHY A TOKEN: this job does not publish. It pushes the tag and lets `release.yml` own the whole
# release — `sbt ci-release` to Sonatype, then the GitHub Release and the install-snippet stamp.
# GitHub deliberately does NOT trigger a workflow from a tag pushed with GITHUB_TOKEN, so the tag is
# pushed with a `RELEASE_TOKEN` secret (a PAT / fine-grained token with contents:write + workflows).
# That trigger alone proved unreliable (#202). The job therefore checks that a Release run started for
# the tag, and dispatches release.yml itself when none did.
#
# This job used to publish inline instead, on the reasoning that inline publishing needs no extra
# token beyond the Sonatype/PGP ones. That stopped being true when #140 gave `release.yml` a second
# job an inline publish does not do (GitHub Release + install-snippet stamp): v0.1.4 was auto-cut
# green, got its artifacts, and had neither a GitHub Release nor current install snippets until the
# tag was deleted and re-pushed by hand (#143). One release path, actually triggered, is the fix.
#
# The RELEASE_TOKEN pre-flight below runs BEFORE the merge, so a missing token leaves the bump PR open
# rather than merging it and cutting a tag nothing will publish.

name: Auto-release on green bump

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  # actions: write lets the job dispatch release.yml for the tag it cut (#202).
  actions: write
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  auto-release:
    name: Merge bump PR and cut a release tag
    # Only a successful, PR-triggered CI run on a same-repo rift-java bump branch.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'chore/rift-java-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Require RELEASE_TOKEN before touching anything
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. The auto-release loop is unarmed: the bump"
            echo "::error::PR must NOT be merged, because a tag pushed with GITHUB_TOKEN would not"
            echo "::error::trigger release.yml — leaving a green run, a real tag, and no release. Add a"
            echo "::error::RELEASE_TOKEN repo secret (PAT/fine-grained, contents:write + workflows) to"
            echo "::error::arm the loop. The bump PR is left open."
            exit 1
          fi
          echo "RELEASE_TOKEN present — loop armed."

      - name: Merge the bump PR
        id: merge
        shell: bash
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          PR="$(gh pr list --repo "${{ github.repository }}" --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -z "${PR}" ]; then
            echo "No open PR for ${BRANCH} (already merged, or closed). Nothing to do."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Squash-merging PR #${PR} (${BRANCH})."
          gh pr merge "${PR}" --repo "${{ github.repository }}" --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Compute the next patch version (first release gated to a human)
        id: ver
        if: steps.merge.outputs.merged == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # The squash-merge advanced master on the remote; move to its new HEAD before tagging so the
          # release points at the merge commit, not the stale checkout.
          git fetch origin "${{ github.event.repository.default_branch }}"
          git reset --hard FETCH_HEAD
          git fetch --tags --force

          LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "${LATEST_TAG}" ]; then
            echo "::notice::This repo has no v* release tag to increment from. The bump PR is merged,"
            echo "::notice::but the FIRST release is intentionally left to a human — cut it by pushing"
            echo "::notice::a v0.1.0 tag (release.yml publishes it). Auto-release takes over from the"
            echo "::notice::next bump."
            echo "cut=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V="${LATEST_TAG#v}"
          MAJ="${V%%.*}"; REST="${V#*.}"; MIN="${REST%%.*}"; PAT="${REST##*.}"
          if ! printf '%s' "${MAJ}${MIN}${PAT}" | grep -qE '^[0-9]+$'; then
            echo "::error::Latest tag ${LATEST_TAG} is not a plain vMAJOR.MINOR.PATCH; refusing to guess. Cut the release by hand."
            exit 1
          fi
          TAG="v${MAJ}.${MIN}.$((PAT + 1))"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; nothing to cut (idempotent no-op)."
            echo "cut=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Latest tag ${LATEST_TAG} -> next ${TAG}."
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "cut=true" >> "$GITHUB_OUTPUT"

      - name: Tag the merge commit (pushed with RELEASE_TOKEN)
        if: steps.ver.outputs.cut == 'true'
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG} (auto-cut after rift-java bump)"

          # Pushed with RELEASE_TOKEN (not GITHUB_TOKEN) so release.yml's `on: push: tags: ["v*"]`
          # actually fires: ci-release to Sonatype, then the GitHub Release and the install-snippet
          # stamp. The token rides in the remote URL via env (Actions masks secrets in logs).
          # actions/checkout stores GITHUB_TOKEN as an `http.https://github.com/.extraheader`
          # Authorization header. git sends that header in preference to the credentials in the URL, so
          # the push authenticated as GITHUB_TOKEN and triggered nothing. That is a likely cause of #202.
          # An empty value clears the extra-header list for this one command.
          git -c "http.https://github.com/.extraheader=" \
            push "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" "refs/tags/${TAG}"
          echo "Pushed ${TAG}."

      # #202: v0.3.1 was tagged here, but release.yml never ran for it. Don't rely on the tag push alone.
      # Give the push-triggered run a short window to appear. If it doesn't, dispatch release.yml for
      # the tag directly (GITHUB_TOKEN is allowed to trigger workflow_dispatch) and check that a run
      # started. Passing the tag as `--ref` makes the run's GITHUB_REF refs/tags/<tag>. If both runs
      # happen, release.yml's per-tag concurrency group runs them one after the other. The second skips
      # the publish once the version is on Maven Central.
      - name: Make sure release.yml runs for the tag
        if: steps.ver.outputs.cut == 'true'
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # $1 = event to match ("" matches any). Prints the newest Release run id for TAG, if any.
          release_run() {
            gh run list --repo "${REPO}" --workflow release.yml --limit 30 \
              --json databaseId,headBranch,event \
              --jq "map(select(.headBranch == \"${TAG}\" and (\"$1\" == \"\" or .event == \"$1\"))) | .[0].databaseId // empty"
          }

          for _ in $(seq 1 9); do
            RUN="$(release_run push)"
            if [ -n "${RUN}" ]; then
              echo "The tag push triggered Release run ${RUN} for ${TAG}; not dispatching."
              exit 0
            fi
            sleep 10
          done

          echo "No push-triggered Release run for ${TAG} after 90s; dispatching release.yml."
          gh workflow run release.yml --repo "${REPO}" --ref "${TAG}" -f tag="${TAG}"

          for _ in $(seq 1 12); do
            sleep 10
            RUN="$(release_run "")"
            if [ -n "${RUN}" ]; then
              echo "Release run ${RUN} started for ${TAG}."
              exit 0
            fi
          done
          echo "::error::No Release run started for ${TAG} after dispatching release.yml. The tag exists,"
          echo "::error::but nothing is publishing it. Recover with: gh workflow run release.yml --ref ${TAG} -f tag=${TAG}"
          exit 1
