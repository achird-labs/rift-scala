# The single release path: `sbt ci-release` to Sonatype, then the GitHub Release and the
# install-snippet stamp. `auto-release.yml` reaches it by pushing a `v*` tag with RELEASE_TOKEN.
#
# `workflow_dispatch` re-runs the whole thing against an EXISTING tag. Before it existed, recovering a
# tag whose release never ran meant deleting and re-pushing the tag by hand (#143) — a destructive
# rewrite of a published ref, for a workflow that is already idempotent per job (`gh release view`
# short-circuits an existing Release; the stamp no-ops when the docs already match).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to release (recovery: re-runs publish + GitHub Release + stamp)"
        required: true
        type: string

# Every job reads the release tag from here rather than from GITHUB_REF_NAME, which on a dispatch is
# the branch the workflow was launched from, not the tag being released.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Publish to Sonatype
    runs-on: ubuntu-latest
    steps:
      # Checking out the tag (not the branch) is what makes dispatch work: sbt-dynver reads the
      # version off the checked-out ref, so ci-release publishes X.Y.Z rather than a -SNAPSHOT.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Verify the tag exists and is a release tag
        run: |
          set -euo pipefail
          if ! printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${TAG}' is not a vMAJOR.MINOR.PATCH release tag; refusing to publish."
            exit 1
          fi
          # A dispatch input is free text: reject a branch name that merely happens to check out, so
          # dynver can never derive a -SNAPSHOT and publish it under a release-shaped name.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} does not exist on origin. This workflow releases an EXISTING tag;"
            echo "::error::push the tag first (auto-release.yml does this on a green bump)."
            exit 1
          fi
          echo "Releasing ${TAG}."
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Publish
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  # Runs only after the artifacts are actually on Sonatype (`needs: publish`), so a failed publish
  # never leaves an orphan GitHub Release or a README stamped to a version that was never published.
  # Holds no Sonatype/PGP secrets — only the write token it needs to create the Release and push the
  # stamp commit.
  github-release:
    name: GitHub Release and install-snippet stamp
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Create the GitHub Release
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — leaving it as-is."
            exit 0
          fi
          # Prefer the annotated tag's own message (the repo's release convention: v0.1.1+ are
          # annotated). Fall back to auto-generated PR notes for a lightweight tag.
          gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-from-tag \
            || gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes

      - name: Stamp the install snippets to the released version
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          git fetch origin master
          git switch -C master origin/master

          # rift-scala's own version is NOT pinned in a file — it comes from the git tag via dynver
          # — so the `rift-scala-*` coordinates and the "current release" line in the install docs
          # are the one place a released version is written by hand, and nothing re-stamped them
          # (scripts/bump.sh only touches the rift-java coordinates). They sat at 0.1.0 through three
          # releases. This closes that: on every release, stamp them to the tag just published so a
          # copy-paste snippet is never a version behind — the #115 bug class, for our own version.
          for f in README.md docs/index.md; do
            sed -E -i "s#(\"rift-scala-[a-z0-9-]+\" % )\"[0-9][0-9.]*\"#\1\"${VERSION}\"#g" "${f}"
            sed -E -i "s#(release is \*\*)[0-9][0-9.]*#\1${VERSION}#g" "${f}"
            sed -E -i "s#(release: )[0-9][0-9.]*#\1${VERSION}#g" "${f}"
          done

          if git diff --quiet -- README.md docs/index.md; then
            echo "Install docs already at ${VERSION} — nothing to stamp."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: stamp install snippets to ${VERSION} [skip ci]" \
            -- README.md docs/index.md
          # Fail-soft: the release itself is already done. A rejected push (master moved during the
          # release) should warn, not turn a successful release red — the fix is a one-line manual
          # stamp, and a red release run is a worse signal than a warning annotation.
          if git push origin HEAD:master; then
            echo "Stamped install snippets to ${VERSION}."
          else
            echo "::warning::Could not push the ${VERSION} install-snippet stamp to master" \
                 "(it likely moved during the release). Stamp README.md and docs/index.md by hand."
          fi
